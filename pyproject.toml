[project]
name = "sft_cv_2026_2027"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "yGifoom", email = "giovisano@gmail.com"},
]
dependencies = [
    "numpy>=2.5.3,<3",
    "tqdm>=4.70.1,<5",
    "pypylon>=26.8,<27",
    "shapely>=2.1.2,<3",
    "dataclasses-json>=0.6.7,<0.7",
    "PyYAML>=6.0.3,<7",
    "pillow>=12.3.0,<13",
    "multiprocessing-logging>=0.4.0,<0.5",
    "pandas>=3.0.6,<4",
    "matplotlib>=3.11.2,<4",
    "networkx>=3.7,<4",
    "process-raw>=0.2.1,<0.3",
    "exifread>=3.5.1,<4",
    "kornia>=0.8.3,<0.9",
    "ensemble-boxes>=1.0.9,<2",
    "opencv-contrib-python>=4.14.0.94,<5",
    "pymavlink>=2.4.50,<3",
    "PyVirtualSerialPorts>=2.0.0,<3",
    "PyQt6>=6.11.0,<7",
    "qrcode>=8.2,<9",
    "pyusb>=1.3.1,<2",
    "protobuf>=7.36.1,<8",
    "GitPython>=3.2.0,<4",
    "ultralytics>=8.4.158,<9",
    "onnx>=1.23.1,<2",
    "onnxslim>=0.1.97,<0.2",
    "pyproj>=3.8.0,<4",
    "pygame>=2.6.1,<3",
    "uvloop>=0.23.0,<0.24",
    "orjson>=3.12.0,<4",
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend>=2.4.9,<3"]
build-backend = "pdm.backend"

[tool.pdm.build]
package-dir = "src"
editable-backend = "path"

[tool.pdm.scripts]
_.env = {PYTHONPATH = "src"}
simulators = "python3 -m tools.simulators"
camera-tuner = "python3 tools/camera_tuner.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "black>=26.5.1,<27",
    "mypy>=2.4.0,<3",
    "pre-commit>=4.6.2,<5",
    "ipykernel>=7.4.0,<8",
    "types-tabulate>=0.10.0.20260508",
    "types-PyYAML>=6.0.12.20260906",
    "types-decorator>=5.2.0.20260712",
    "scikit-learn>=1.9.1,<2",
    "cvxopt>=1.3.3,<2",
    "zstandard>=0.25.0,<0.26",
    "setuptools>=84.0.0,<85",
]

# x86_64 development workstation with CUDA 12.6.
# Install together with dev: pdm install -G dev -G dev-cu126
dev-cu126 = [
    "torch @ https://download-r2.pytorch.org/whl/cu126/torch-2.14.1%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "torchvision @ https://download-r2.pytorch.org/whl/cu126/torchvision-0.29.1%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl ; platform_machine == 'x86_64' and sys_platform == 'linux'",
    "tensorrt-cu12>=10.16.1.11,<11 ; platform_machine == 'x86_64' and sys_platform == 'linux'",
]

# JetPack 7.2.x / Ubuntu 24.04 / Python 3.12 / aarch64 / CUDA 13.2.
# TensorRT is intentionally not pip-installed here: use the JetPack-provided version.
jetson = [
    "torch @ https://download-r2.pytorch.org/whl/cu132/torch-2.14.1%2Bcu132-cp312-cp312-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "torchvision @ https://download-r2.pytorch.org/whl/cu132/torchvision-0.29.1%2Bcu132-cp312-cp312-manylinux_2_28_aarch64.whl ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "onnxruntime-gpu==1.30.0 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
]
