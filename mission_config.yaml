- dummy_consumer:
  - default:
    - instances: 10
    - release_delay_range:
      - 3.0
      - 4.0
- cam:
  - camera_engine:
    - resolution:
      - 5320
      - 3032
    - channels: 1
    - pixel_format: BayerRG8
    - offset_x: 0
    - offset_y: 0
    - reverse_x: false
    - reverse_y: false
    - start_delay: 0
    - acquisition_time: 300
    - acquisition_frame_rate_enable: false
    - acquisition_frame_rate: 5.0
    - exposure_mode: Timed
    - exposure_auto: Continuous
    - exposure_time: 1000.0
    - auto_gain: Continuous
    - gain: 0.0
    - profile:
        min_exposure_time: 100
        max_exposure_time: 2000
        min_auto_gain: 0.0
        max_auto_gain: 5.0
        auto_target_brightness: 0.2
    - auto_function_profile: MinimizeGain
    - gamma: 1.0
    - black_level: 0.0
    - bsl_color_space: null
    - balance_white_auto: Continuous
    - light_source_preset: Daylight5000K
    - trigger_selector: FrameStart
    - trigger_mode: 'On'
    - trigger_source: Software
    - trigger_activation: RisingEdge
    - trigger_delay: 0.0
    - line_selector: Line2
    - line_mode: Output
    - line_source: ExposureActive
    - line_inverter: false
    - max_num_buffer: 10
    - output_queue_size: 10
    - chunk_mode_active: true
    - chunk_selector: CounterValue
    - chunk_counter_selector: Counter2
    - chunk_enable: true
- sensor_generator:
  - default:
    - external_clock: true
    - generation_rate_hz: 60
    - first_capture_id: 0
    - latitude: 45.0
    - longitude: 9.0
    - coordinate_step: 0.0001
    - altitude_msl: 150.0
    - altitude_relative: 50.0
    - waypoints: 10
- viewer:
  - default:
    - display: false
    - preview_resolution:
      - 1064
      - 606
    - window_name: 'Registry: image + PixData (Q / Esc to quit)'
    - max_frames: 0
